<div class="app-layout">
  <!-- MMT Top Navigation Bar -->
  <app-navbar
    (openAuth)="isAuthOpen.set(true)"
    (openCart)="isCartOpen.set(true)"
    (openPostProperty)="isSellerPortalOpen.set(true)"
    (openSellerDashboard)="isSellerPortalOpen.set(true)"
    (openAdminPanel)="isAdminPanelOpen.set(true)"
    (homeClick)="onHomeReset()"
  />

  <main class="app-main">
    <!-- MMT Hero Section & Super Search Widget -->
    <app-hero-search
      [cities]="cities()"
      [activeCityId]="activeFilter().cityId ?? null"
      [activeOption]="activeFilter().propertyOption || 'Sell'"
      [activeType]="activeFilter().propertyType || ''"
      [activeSort]="activeFilter().sortBy || ''"
      (searchTriggered)="onSearchTriggered($event)"
    />

    <!-- Main Property Feed & Sticky Filters -->
    <app-property-list
      [properties]="properties()"
      [cities]="cities()"
      [activeCityId]="activeFilter().cityId ?? null"
      [activeOption]="activeFilter().propertyOption || ''"
      [activeType]="activeFilter().propertyType || ''"
      [activeSort]="activeFilter().sortBy || ''"
      [activeCity]="activeCity()"
      [allVerifiedProperties]="allVerifiedProperties()"
      [isBuyer]="isBuyer()"
      [cartPropertyIds]="cartPropertyIds()"
      [isLoading]="isLoadingProperties()"
      (filterChange)="onFilterChanged($event)"
      (clearCity)="onClearCity()"
      (openContact)="openOwnerContact($event)"
      (toggleCart)="onToggleCart($event)"
      (viewDetails)="openPropertyDetails($event)"
    />
  </main>

  <!-- MMT Branded Footer -->
  <footer class="mmt-footer">
    <div class="container footer-content">
      <div class="footer-brand">
        <span class="footer-logo">🏠 EasyHousing Solutions</span>
        <p class="footer-tagline">Making property buying, selling, and renting seamless across India.</p>
      </div>
      <div class="footer-meta">
        <p class="copyright">© 2026 Easy Housing Solutions (EHS). All rights reserved.</p>
      </div>
    </div>
  </footer>

  <!-- MODALS -->
  <app-auth-modal
    [isOpen]="isAuthOpen()"
    [states]="states()"
    [cities]="cities()"
    (close)="isAuthOpen.set(false)"
    (authSuccess)="onAuthSuccess($event)"
  />

  <app-cart-modal
    [isOpen]="isCartOpen()"
    [items]="cartService.cartItems()"
    (close)="isCartOpen.set(false)"
    (removeItem)="onRemoveCartItem($event)"
    (contactOwner)="openOwnerContact($event)"
  />

  <app-contact-modal
    [isOpen]="isContactOpen()"
    [contact]="selectedContact()"
    [loading]="isLoadingContact()"
    (close)="isContactOpen.set(false)"
  />

  <app-property-detail-modal
    [isOpen]="isDetailOpen()"
    [property]="selectedDetailProperty()"
    [isBuyer]="isBuyer()"
    [isInCart]="selectedDetailProperty() ? cartPropertyIds().includes(selectedDetailProperty()!.propertyId) : false"
    (close)="isDetailOpen.set(false)"
    (contactOwner)="openOwnerContact($event)"
    (toggleCart)="onToggleCart($event)"
  />

  <app-seller-portal
    [isOpen]="isSellerPortalOpen()"
    [sellerId]="authService.currentUser()?.profileId || 0"
    [states]="states()"
    [cities]="cities()"
    (close)="isSellerPortalOpen.set(false)"
    (propertyCreated)="loadProperties()"
  />

  <app-admin-panel
    [isOpen]="isAdminPanelOpen()"
    [cities]="cities()"
    (close)="isAdminPanelOpen.set(false)"
    (propertyStatusChanged)="loadProperties()"
  />

  <!-- Floating Toast Notifications -->
  <app-toast
    [message]="toastMessage()"
    [type]="toastType()"
  />
</div>
